<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>宽宽牌教室分配系统</title>
  <style>
    :root{
      --bg:#f5f7fb;
      --bg-2:#eef2ff;
      --card:#ffffff;
      --bd:#e5e7f5;
      --txt:#0f172a;
      --muted:#5b6476;
      --pri:#4f7cff;
      --pri-soft:rgba(79,124,255,.14);
      --danger:#ef4444;
      --danger-soft:rgba(239,68,68,.14);
      --ok:#22c55e;
      --ok-soft:rgba(34,197,94,.14);
      --shadow:0 18px 40px rgba(15,23,42,.12);
      --r:20px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial;
      color:var(--txt);
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(79,124,255,.16), transparent),
        radial-gradient(900px 400px at 90% 0%, rgba(34,197,94,.14), transparent),
        linear-gradient(180deg, var(--bg-2), var(--bg));
    }
    .wrap{max-width:1180px;margin:0 auto;padding:22px 18px 50px}
    .top{
      display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
      padding:18px 20px;border-radius:24px;border:1px solid var(--bd);
      background:var(--card);
      box-shadow:var(--shadow);
    }
    .brand{display:flex;flex-direction:column;gap:6px}
    .brand .t{font-size:22px;font-weight:900;letter-spacing:.6px}
    .brand .s{font-size:12.5px;color:var(--muted);line-height:1.55}
    .tabs{display:flex;gap:8px;flex-wrap:wrap}
    .tabs button{
      border:1px solid var(--bd);background:#fff;color:var(--txt);
      padding:10px 14px;border-radius:14px;cursor:pointer;font-weight:800;
      box-shadow:0 6px 16px rgba(15,23,42,.08);
    }
    .tabs button.primary{
      border-color:rgba(79,124,255,.35);
      background:linear-gradient(180deg, #5a82ff, #4f7cff);
      color:#fff;
    }
    .tabs button.danger{
      border-color:rgba(239,68,68,.35);
      background:linear-gradient(180deg, #f87171, #ef4444);
      color:#fff;
    }
    .msg{
      margin-top:14px;padding:12px 14px;border-radius:16px;border:1px solid var(--bd);
      background:var(--card);color:var(--muted);box-shadow:0 10px 26px rgba(15,23,42,.08)
    }
    .msg.ok{border-color:rgba(34,197,94,.25);background:var(--ok-soft);color:#14532d}
    .msg.bad{border-color:rgba(239,68,68,.25);background:var(--danger-soft);color:#7f1d1d}
    #app{margin-top:14px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media (max-width: 980px){ .grid{grid-template-columns:1fr} }
    h3{margin:0 0 10px 0;font-size:16px}
    .card{
      border:1px solid var(--bd);background:var(--card);
      border-radius:var(--r);padding:16px;box-shadow:var(--shadow)
    }
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media (max-width: 600px){ .row{grid-template-columns:1fr} }
    input,select{
      width:100%;padding:12px 12px;border-radius:14px;border:1px solid #d8dbea;
      background:#fff;color:var(--txt);outline:none;
      box-shadow:0 6px 18px rgba(15,23,42,.06);
    }
    select{cursor:pointer}
    button{
      border:1px solid var(--bd);background:#fff;color:var(--txt);
      padding:10px 14px;border-radius:14px;cursor:pointer;font-weight:900;
      box-shadow:0 6px 16px rgba(15,23,42,.08);
    }
    button.primary{
      border-color:rgba(79,124,255,.35);
      background:linear-gradient(180deg, #5a82ff, #4f7cff);
      color:#fff;
    }
    button.danger{
      border-color:rgba(239,68,68,.35);
      background:linear-gradient(180deg, #f87171, #ef4444);
      color:#fff;
    }
    button.small{padding:8px 10px;border-radius:12px;font-weight:800}
    .meta{color:var(--muted);font-size:12px;line-height:1.6}
    .list{display:flex;flex-direction:column;gap:10px}
    .item{
      display:flex;justify-content:space-between;gap:10px;align-items:flex-start;
      padding:12px;border-radius:16px;border:1px solid var(--bd);background:#fff;
      box-shadow:0 10px 24px rgba(15,23,42,.08)
    }
    .item .left{display:flex;flex-direction:column;gap:2px}
    .item .t{font-weight:900}
    .item .s{color:var(--muted);font-size:12px}
    pre{
      white-space:pre-wrap;word-break:break-word;
      padding:12px;border-radius:16px;border:1px solid var(--bd);background:#f8fafc;
      color:var(--txt);min-height:140px
    }
    .cal{margin-top:12px;border:1px solid var(--bd);border-radius:16px;padding:12px;background:#fff}
    .calhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:8px}
    .dow{color:var(--muted);font-size:12px;text-align:center;padding:6px 0}
    .day{padding:10px 0;border-radius:12px;text-align:center;border:1px solid #e2e8f0;background:#f8fafc;cursor:pointer}
    .day.off{opacity:.35;cursor:default}
    .day.on{border-color:var(--pri-bd);background:var(--pri);font-weight:900}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      border:1px solid var(--bd);background:#fff;
      padding:10px 12px;border-radius:14px;cursor:pointer;
      box-shadow:0 6px 16px rgba(15,23,42,.08);
    }
    .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="t">宽宽牌教室分配系统</div>
        <div class="s">
          时间规则：每天 08:00–23:00，90分钟/节，无间隔（共10个时间段）<br/>
          流程：教室 → 班级（人数/偏好/可上时间段） → 教师（可上时间段） → 排课任务（日历选日期+课程+教师+连续几节） → 一键排课 → 复制课表发群
        </div>
      </div>
      <div class="tabs">
        <button onclick="tab('rooms')">教室</button>
        <button onclick="tab('classes')">班级</button>
        <button onclick="tab('teachers')">教师</button>
        <button onclick="tab('tasks')">排课任务</button>
        <button onclick="tab('schedules')" class="primary">课表复制</button>
        <button onclick="solveSchedule()" class="primary">一键排课</button>
        <button onclick="exportData()">导出备份</button>
        <label class="pill" style="margin:0">
          导入备份 <input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(this.files[0])">
        </label>
      </div>
    </div>

    <div id="msg" class="msg">加载中…</div>
    <div id="app"></div>
    <div class="meta" style="margin-top:12px">
      提示：可上时间段用“打勾”控制（限制越多越难排）。如果提示“无可行解”，请增加教室、放宽教师/班级可上时间段或减少冲突。
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
