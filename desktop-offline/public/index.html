<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>宽宽牌教室分配系统</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="t">宽宽牌教室分配系统</div>
        <div class="s">
          时间规则：每天 08:00–23:00，90分钟/节，无间隔（共10个时间段）<br/>
          流程：教室 → 班级（人数/偏好/可上时间段） → 教师（可上时间段/科目） → 排课任务（日历选日期+教师+时间段） → 一键排课 → 复制课表发群
        </div>
      </div>
      <div class="tabs">
        <button onclick="tab('rooms')">教室</button>
        <button onclick="tab('classes')">班级</button>
        <button onclick="tab('teachers')">教师</button>
        <button onclick="tab('tasks')">排课任务</button>
        <button onclick="tab('schedules')" class="primary">课表复制</button>
        <button onclick="solveSchedule()" class="primary">一键排课</button>
        <button onclick="exportData()">导出备份</button>
        <label class="pill" style="margin:0">
          导入备份 <input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(this.files[0])">
        </label>
      </div>
    </div>

    <div id="msg" class="msg">加载中…</div>
    <div id="app"></div>
    <div class="meta" style="margin-top:12px">
      提示：可上时间段用“打勾”控制（限制越多越难排）。如果提示“无可行解”，请增加教室、放宽教师/班级可上时间段或减少冲突。
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
