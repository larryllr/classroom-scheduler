<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>宽宽牌教室分配系统</title>
  <style>
    :root{--bg:#0b1220;--text:#eef3ff;--muted:#9fb0d0;--line:rgba(255,255,255,.10)}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, rgba(110,168,255,.35), transparent),
                  radial-gradient(900px 500px at 90% 0%, rgba(69,212,131,.25), transparent),
                  var(--bg);
      color:var(--text);
    }
    .wrap{max-width:980px;margin:0 auto;padding:18px}
    .top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
    .title{display:flex;gap:10px;align-items:center}
    .title img{width:34px;height:34px}
    .title b{font-size:20px}
    .sub{color:var(--muted);font-size:13px;margin-top:4px;line-height:1.4}
    .card{background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
    .tabs{display:flex;gap:8px;flex-wrap:wrap}
    button{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);
      padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:650}
    button.primary{background:rgba(110,168,255,.20);border-color:rgba(110,168,255,.35)}
    .msg{margin-top:10px;color:#ffd2d2}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="title">
          <img src="/logo.svg" alt="logo">
          <div>
            <b>宽宽牌教室分配系统</b>
            <div class="sub">流程：教室 → 班级 → 课程（点日历选日期）→ 一键生成 → 复制发群；支持：当天不换教室、班级优先教室、备份恢复、导出Excel/Word、管理员密码。</div>
          </div>
        </div>
      </div>
      <div class="tabs">
        <button onclick="tab('rooms')">① 教室</button>
        <button onclick="tab('classes')">② 班级</button>
        <button onclick="tab('courses')">③ 课程</button>
        <button class="primary" onclick="solve()">④ 一键生成</button>
        <button onclick="tab('timetable')">⑤ 课表复制</button>
        <button onclick="tab('settings')">⚙ 设置</button>
      </div>
    </div>

    <div class="card">
      <div id="app">加载中…</div>
      <div id="msg" class="msg"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
