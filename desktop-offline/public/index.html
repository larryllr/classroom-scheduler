<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>宽宽牌教室分配系统</title>
  <style>
    :root{
      --bg:#f4f6fb;
      --bg-2:#eef1ff;
      --card:#ffffff;
      --bd:#e1e6f3;
      --txt:#0f172a;
      --muted:#5b6476;
      --blue:#0f3b82;
      --blue-2:#133f8b;
      --blue-soft:rgba(15,59,130,.12);
      --red:#e53e3e;
      --red-soft:rgba(229,62,62,.14);
      --ok:#22c55e;
      --ok-soft:rgba(34,197,94,.14);
      --shadow:0 18px 40px rgba(15,23,42,.12);
      --r:20px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial;
      color:var(--txt);
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(15,59,130,.16), transparent),
        radial-gradient(900px 400px at 90% 0%, rgba(34,197,94,.12), transparent),
        linear-gradient(180deg, var(--bg-2), var(--bg));
    }
    .shell{max-width:1180px;margin:0 auto;padding:22px 18px 50px}
    .topbar{
      display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
      padding:18px 20px;border-radius:24px;border:1px solid var(--bd);
      background:var(--card);box-shadow:var(--shadow);
    }
    .brand{display:flex;align-items:center;gap:12px}
    .logo{
      width:44px;height:44px;border-radius:14px;background:var(--blue);color:#fff;
      display:flex;align-items:center;justify-content:center;font-weight:900;
      box-shadow:0 10px 24px rgba(15,23,42,.18);
    }
    .title{font-size:22px;font-weight:900;letter-spacing:.6px}
    .sub{font-size:12.5px;color:var(--muted);line-height:1.55}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
    .tab{
      border:1px solid rgba(15,59,130,.3);background:var(--blue);color:#fff;
      padding:10px 14px;border-radius:14px;cursor:pointer;font-weight:800;
      box-shadow:0 6px 16px rgba(15,23,42,.12);
    }
    .tab.active{background:var(--red);border-color:rgba(229,62,62,.45)}
    .tab:active{background:var(--red);border-color:rgba(229,62,62,.45)}
    .tab:focus,
    .tab:focus-visible{background:var(--red);border-color:rgba(229,62,62,.45);outline:none}
    .status{
      margin-top:14px;padding:12px 14px;border-radius:16px;border:1px solid var(--bd);
      background:var(--card);color:var(--muted);box-shadow:0 10px 26px rgba(15,23,42,.08)
    }
    .status.ok{border-color:rgba(34,197,94,.25);background:var(--ok-soft);color:#14532d}
    .status.err{border-color:rgba(229,62,62,.25);background:var(--red-soft);color:#7f1d1d}
    .main{margin-top:14px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media (max-width: 980px){ .grid2{grid-template-columns:1fr} }
    .card{
      border:1px solid var(--bd);background:var(--card);
      border-radius:var(--r);padding:16px;box-shadow:var(--shadow)
    }
    .cardTitle{font-weight:900;margin-bottom:10px}
    .form{display:flex;flex-direction:column;gap:10px}
    .form.inline{flex-direction:row;flex-wrap:wrap;gap:10px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .rowBtns{display:flex;gap:10px;flex-wrap:wrap}
    .tableWrap{overflow:auto}
    table{width:100%;border-collapse:collapse}
    th,td{padding:10px 8px;border-bottom:1px solid #eef2f8;text-align:left;font-size:13px}
    th{color:var(--muted);font-weight:700}
    .right{text-align:right}
    input,select{
      width:100%;padding:12px;border-radius:14px;border:1px solid #d8dbea;
      background:#fff;color:var(--txt);outline:none;
      box-shadow:0 6px 18px rgba(15,23,42,.06);
    }
    select{cursor:pointer}
    .btn{
      border:1px solid rgba(15,59,130,.35);background:var(--blue);color:#fff;
      padding:10px 14px;border-radius:14px;cursor:pointer;font-weight:900;
      box-shadow:0 6px 16px rgba(15,23,42,.12);
    }
    .btn.sm{padding:8px 10px;border-radius:12px;font-weight:800}
    .btn.ghost{background:var(--blue-2)}
    .btn.primary{background:var(--blue)}
    .btn.danger{background:var(--blue)}
    .btn:active{background:var(--red);border-color:rgba(229,62,62,.45)}
    .btn:focus,
    .btn:focus-visible{background:var(--red);border-color:rgba(229,62,62,.45);outline:none}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      border:1px solid rgba(15,59,130,.35);background:var(--blue);color:#fff;
      padding:10px 12px;border-radius:14px;cursor:pointer;
      box-shadow:0 6px 16px rgba(15,23,42,.12);
    }
    .pill input{display:none}
    .muted{color:var(--muted)}
    .small{font-size:12px}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{
      padding:6px 10px;border-radius:999px;border:1px solid #d8dbea;background:#fff;cursor:pointer;font-size:12px
    }
    .chip.on{background:var(--blue-soft);border-color:rgba(15,59,130,.3);font-weight:800}
    .calendarWrap{margin-top:8px}
    .calTitle{font-weight:800;margin-bottom:6px}
    .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
    #calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
    .calH{font-size:12px;color:var(--muted);text-align:center}
    .calCell{
      border:1px solid #e2e8f0;border-radius:10px;padding:8px 0;text-align:center;
      background:#fff;color:var(--txt);cursor:pointer;
    }
    .calCell.muted{background:#f8fafc;border-color:#eef2f8}
    .calCell.picked{background:var(--blue);color:#fff;border-color:rgba(15,59,130,.45)}
    .calCell:active{background:var(--red);color:#fff;border-color:rgba(229,62,62,.45)}
    .output{min-height:160px;background:#f8fafc;border-radius:16px;border:1px solid var(--bd);padding:12px}
    .footer{margin-top:14px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;gap:6px}
    .toast{
      position:fixed;right:24px;bottom:24px;background:var(--blue);color:#fff;
      padding:10px 14px;border-radius:12px;opacity:0;transform:translateY(10px);
      transition:all .2s ease;box-shadow:0 12px 24px rgba(15,23,42,.18)
    }
    .toast.show{opacity:1;transform:translateY(0)}
    /* legacy markup compatibility */
    .wrap{max-width:1180px;margin:0 auto;padding:22px 18px 50px}
    .top{
      display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
      padding:18px 20px;border-radius:24px;border:1px solid var(--bd);
      background:var(--card);box-shadow:var(--shadow);
    }
    .brand .t{font-size:22px;font-weight:900;letter-spacing:.6px}
    .brand .s{font-size:12.5px;color:var(--muted);line-height:1.55}
    .msg{
      margin-top:14px;padding:12px 14px;border-radius:16px;border:1px solid var(--bd);
      background:var(--card);color:var(--muted);box-shadow:0 10px 26px rgba(15,23,42,.08)
    }
    .msg.ok{border-color:rgba(34,197,94,.25);background:var(--ok-soft);color:#14532d}
    .msg.bad{border-color:rgba(229,62,62,.25);background:var(--red-soft);color:#7f1d1d}
    .meta{color:var(--muted);font-size:12px;line-height:1.6}
    .boot{
      min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:10px;color:var(--muted)
    }
    .boot.err{color:#7f1d1d}
    .spinner{
      width:40px;height:40px;border-radius:50%;border:4px solid #e2e8f0;border-top-color:var(--blue);
      animation:spin 1s linear infinite
    }
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="t">宽宽牌教室分配系统</div>
        <div class="s">
          时间规则：每天 08:00–23:00，90分钟/节，无间隔（共10个时间段）<br/>
          流程：教室 → 班级（人数/偏好/可上时间段） → 教师（可上时间段） → 排课任务（日历选日期+课程+教师+连续几节） → 一键排课 → 复制课表发群
        </div>
      </div>
      <div class="tabs">
        <button onclick="tab('rooms')">教室</button>
        <button onclick="tab('classes')">班级</button>
        <button onclick="tab('teachers')">教师</button>
        <button onclick="tab('tasks')">排课任务</button>
        <button onclick="tab('schedules')" class="primary">课表复制</button>
        <button onclick="solveSchedule()" class="primary">一键排课</button>
        <button onclick="exportData()">导出备份</button>
        <label class="pill" style="margin:0">
          导入备份 <input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(this.files[0])">
        </label>
      </div>
    </div>

    <div id="msg" class="msg">加载中…</div>
    <div id="app"></div>
    <div class="meta" style="margin-top:12px">
      提示：可上时间段用“打勾”控制（限制越多越难排）。如果提示“无可行解”，请增加教室、放宽教师/班级可上时间段或减少冲突。
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
