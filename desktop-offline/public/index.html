<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>宽宽牌教室自动分配系统</title>
  <style>
    :root{
      --bg:#0b1220;
      --card:#0f1a33;
      --muted:#9fb0d0;
      --text:#eef3ff;
      --line:rgba(255,255,255,.10);
      --brand:#6ea8ff;
      --danger:#ff6b6b;
      --ok:#45d483;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, rgba(110,168,255,.35), transparent),
                  radial-gradient(900px 500px at 90% 0%, rgba(69,212,131,.25), transparent),
                  var(--bg);
      color:var(--text);
    }
    .wrap{max-width:980px;margin:0 auto;padding:18px}
    .top{
      display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;
      margin-bottom:14px;
    }
    .title{font-size:20px;font-weight:800}
    .sub{color:var(--muted);font-size:13px;margin-top:4px;line-height:1.4}
    .card{
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    button{
      border:1px solid var(--line);
      background: rgba(255,255,255,.06);
      color:var(--text);
      padding:10px 12px;border-radius:12px;
      cursor:pointer;
      font-weight:650;
    }
    button.primary{background: rgba(110,168,255,.20); border-color: rgba(110,168,255,.35)}
    button.danger{background: rgba(255,107,107,.16); border-color: rgba(255,107,107,.35); color:#ffecec}
    button:active{transform: translateY(1px)}
    input, select{
      width:100%;
      border:1px solid var(--line);
      background: rgba(255,255,255,.05);
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
      outline:none;
    }
    input::placeholder{color: rgba(238,243,255,.45)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:720px){.row{grid-template-columns:1fr}}
    .tabs{display:flex;gap:8px;flex-wrap:wrap}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:860px){.grid{grid-template-columns:1fr}}
    .list{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
    .item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
    .meta{color:var(--muted);font-size:13px;line-height:1.4}
    .msg{margin-top:10px;color:#ffd2d2}
    .ok{color:#bff7d6}
    .cal{
      margin-top:10px;
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px;
      background: rgba(255,255,255,.04);
    }
    .calhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
    .day{padding:10px 0;border-radius:12px;text-align:center;border:1px solid var(--line);cursor:pointer;background: rgba(255,255,255,.03)}
    .day.off{opacity:.35;cursor:default}
    .day.on{background: rgba(110,168,255,.20);border-color: rgba(110,168,255,.45)}
    .dow{color:var(--muted);font-size:12px;text-align:center}
    pre{white-space:pre-wrap;background:rgba(255,255,255,.04);border:1px solid var(--line);padding:12px;border-radius:14px}

    /* ✅ 修复：日期选择器/下拉在部分浏览器强制白底，导致白字看不见 */
    input[type="date"],
    input[type="time"],
    select{
      background: rgba(255,255,255,.92) !important;
      color: #0b1220 !important;
      border-color: rgba(0,0,0,.15) !important;
    }
    input[type="date"]::-webkit-datetime-edit,
    input[type="time"]::-webkit-datetime-edit{
      color:#0b1220 !important;
    }
    option{ color:#0b1220; }

    /* 其它输入框继续深色风格 */
    input:not([type="date"]):not([type="time"]),
    textarea{
      background: rgba(255,255,255,.05);
      color: var(--text);
      border: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="title">教室自动分配系统</div>
        <div class="sub">按“日期 + 时间段”排课；支持“当天不换教室”；支持“班级优先教室”；一键复制发群。</div>
      </div>
      <div class="tabs">
        <button onclick="tab('rooms')">① 教室</button>
        <button onclick="tab('classes')">② 班级</button>
        <button onclick="tab('courses')">③ 课程</button>
        <button class="primary" onclick="solve()">④ 一键生成</button>
        <button onclick="tab('timetable')">⑤ 课表复制</button>
      </div>
    </div>

    <div class="card">
      <div id="app">加载中…</div>
      <div id="msg" class="msg"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
