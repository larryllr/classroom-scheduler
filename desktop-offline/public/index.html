<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>宽宽牌教室分配系统</title>
  <style>
    :root{
      --bg:#0b1220;
      --card:rgba(255,255,255,.06);
      --bd:rgba(255,255,255,.12);
      --txt:#eef3ff;
      --muted:#9fb0d0;
      --pri:rgba(110,168,255,.22);
      --pri-bd:rgba(110,168,255,.35);
      --danger:rgba(255,120,120,.18);
      --danger-bd:rgba(255,120,120,.35);
      --ok:rgba(69,212,131,.18);
      --ok-bd:rgba(69,212,131,.35);
      --shadow:0 10px 30px rgba(0,0,0,.35);
      --r:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial;
      color:var(--txt);
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(110,168,255,.35), transparent),
        radial-gradient(900px 500px at 90% 0%, rgba(69,212,131,.25), transparent),
        var(--bg);
    }
    .wrap{max-width:1180px;margin:0 auto;padding:18px 14px 40px}
    .top{
      display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
      padding:16px;border-radius:var(--r);border:1px solid var(--bd);
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      box-shadow:var(--shadow);
    }
    .brand{display:flex;flex-direction:column;gap:4px}
    .brand .t{font-size:20px;font-weight:900;letter-spacing:.6px}
    .brand .s{font-size:12px;color:var(--muted)}
    .tabs{display:flex;gap:8px;flex-wrap:wrap}
    .tabs button{
      border:1px solid var(--bd);background:rgba(255,255,255,.04);color:var(--txt);
      padding:10px 12px;border-radius:14px;cursor:pointer;font-weight:700
    }
    .tabs button.primary{border-color:var(--pri-bd);background:var(--pri)}
    .msg{margin-top:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--bd);background:rgba(255,255,255,.04);color:var(--muted)}
    .msg.ok{border-color:var(--ok-bd);background:var(--ok);color:#d9ffe8}
    #app{margin-top:14px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media (max-width: 980px){ .grid{grid-template-columns:1fr} }
    h3{margin:0 0 10px 0;font-size:16px}
    .card{
      border:1px solid var(--bd);background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border-radius:var(--r);padding:14px;box-shadow:var(--shadow)
    }
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media (max-width: 600px){ .row{grid-template-columns:1fr} }
    input,select{
      width:100%;padding:12px 12px;border-radius:14px;border:1px solid rgba(0,0,0,.08);
      background:rgba(255,255,255,.92);color:#0b1220;outline:none;
    }
    select{cursor:pointer}
    button{
      border:1px solid var(--bd);background:rgba(255,255,255,.04);color:var(--txt);
      padding:10px 12px;border-radius:14px;cursor:pointer;font-weight:800
    }
    button.primary{border-color:var(--pri-bd);background:var(--pri)}
    button.danger{border-color:var(--danger-bd);background:var(--danger)}
    .meta{color:var(--muted);font-size:12px;line-height:1.5}
    .list{display:flex;flex-direction:column;gap:10px}
    .item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border-radius:16px;border:1px solid var(--bd);background:rgba(255,255,255,.03)}
    pre{
      white-space:pre-wrap;word-break:break-word;
      padding:12px;border-radius:16px;border:1px solid var(--bd);background:rgba(0,0,0,.18);
      color:var(--txt);min-height:120px
    }
    .cal{margin-top:12px;border:1px solid var(--bd);border-radius:16px;padding:12px;background:rgba(255,255,255,.03)}
    .calhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
    .dow{color:var(--muted);font-size:12px;text-align:center;padding:6px 0}
    .day{padding:10px 0;border-radius:12px;text-align:center;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.02);cursor:pointer}
    .day.off{opacity:.35;cursor:default}
    .day.on{border-color:var(--pri-bd);background:var(--pri);font-weight:900}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      border:1px solid var(--bd);background:rgba(255,255,255,.04);
      padding:10px 12px;border-radius:14px;cursor:pointer
    }
    .footer{margin-top:14px;color:var(--muted);font-size:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="t">宽宽牌教室分配系统</div>
        <div class="s">流程：教室 → 班级 → 日历选日期上课 → 一键生成 → 复制发群</div>
      </div>
      <div class="tabs">
        <button onclick="tab('rooms')">教室</button>
        <button onclick="tab('classes')">班级</button>
        <button onclick="tab('courses')">课程日期</button>
        <button onclick="tab('timetable')" class="primary">课表复制</button>
        <button onclick="solve()" class="primary">一键生成</button>
      </div>
    </div>

    <div id="msg" class="msg">就绪</div>
    <div id="app"></div>

    <div class="footer">离线版数据保存在本机：可导出/导入 JSON 备份。</div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
