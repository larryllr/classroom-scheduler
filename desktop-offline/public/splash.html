<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>启动中</title>
<style>
  body{margin:0;background:transparent;font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;}
  .box{
    width:520px;height:320px;border-radius:22px;
    background: radial-gradient(700px 300px at 10% 0%, rgba(110,168,255,.55), transparent),
                radial-gradient(700px 300px at 90% 0%, rgba(69,212,131,.35), transparent),
                rgba(11,18,32,.92);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 20px 50px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;
    color:#eef3ff;
  }
  .logo{width:74px;height:74px;border-radius:18px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}
  .logo img{width:54px;height:54px}
  .t{font-weight:900;font-size:18px}
  .s{color:#9fb0d0;font-size:13px}
  .dot{display:flex;gap:6px}
  .dot span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.28);animation:b 1.1s infinite}
  .dot span:nth-child(2){animation-delay:.15s}
  .dot span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-6px);opacity:1}}
</style>
</head>
<body>
  <div class="box">
    <div class="logo"><img src="/logo.svg" alt="logo"/></div>
    <div class="t">宽宽牌教室分配系统</div>
    <div class="s">正在启动离线服务…</div>
    <div class="dot"><span></span><span></span><span></span></div>
  </div>
</body>
</html>
