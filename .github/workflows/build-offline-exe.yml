name: Build Offline EXE (Kuankuan)

on:
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: Kuankuan-Classroom-Offline-EXE
          path: desktop-offline/dist/*.exe
